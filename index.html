<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metal BOM Sheet</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17324b;background:#f3f6f9;font-synthesis:none;font-optical-sizing:auto}
    *{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#153957,#286b96);color:#fff;padding:34px max(22px,calc((100vw - 1120px)/2))}h1{font-size:28px;margin:0;letter-spacing:-.35px}header p{margin:8px 0 0;color:#dcebf5;max-width:680px}main{max-width:1120px;padding:0 20px;margin:28px auto 60px}.panel{background:#fff;border:1px solid #dce5ec;border-radius:14px;box-shadow:0 12px 28px #17324b10;padding:24px;margin-bottom:20px}.upload-panel{max-width:760px;margin:0 auto 22px}h2{font-size:18px;margin:0 0 8px;color:#173d5b}.sub{color:#62788b;font-size:13px;margin:0 0 18px}.dropbox{border:2px dashed #b6c9d8;border-radius:12px;background:#f8fbfd;padding:25px;text-align:center}.dropbox input{display:block;width:min(100%,460px);margin:0 auto 12px;padding:10px;border:1px solid #ccd8e1;background:#fff;border-radius:8px;color:#29445b}.dropbox strong{display:block;margin-bottom:4px}.dropbox span{font-size:12px;color:#687f91}.status{min-height:22px;margin:14px 0 0;font-size:13px;color:#176b52}.status.error{color:#a33e3e}.result{display:none}.result.visible{display:block}.section-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 20px}.section-tabs{display:flex;flex:1;min-width:0;gap:8px;overflow-x:auto;border-bottom:1px solid #dce5ec;margin:0;padding:0 0 10px}.section-tab{flex:0 0 auto;background:#eef3f7;color:#34546d}.section-tab:hover{background:#dfeaf1}.section-tab[aria-selected="true"]{background:#286c9b;color:#fff}.download-all{flex:0 0 auto;white-space:nowrap}.download-all:disabled{opacity:.5;cursor:not-allowed}.section-content[hidden]{display:none}.section-placeholder{min-height:150px;display:grid;align-content:center;justify-items:center;text-align:center;color:#62788b;background:#f8fbfd;border:1px dashed #ccd8e1;border-radius:10px;padding:28px}.section-placeholder h3{margin:0 0 8px;color:#173d5b;font-size:17px}.section-placeholder p{margin:0;font-size:13px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:14px 0 20px}.summary div{padding:11px 13px;background:#f5f8fa;border-radius:8px}.summary small{display:block;color:#657d8f;font-size:11px;margin-bottom:4px}.summary strong{font-size:14px;overflow-wrap:anywhere}.variant-list{display:grid;gap:7px;margin:0 0 18px}.variant-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#f5f8fa;border:1px solid #e2e9ee;border-radius:8px;font-size:13px}.remove-variant{padding:6px 10px;background:#fbeeee;color:#963f3f;font-size:12px}.remove-variant:hover{background:#f4dddd}.tile-form{display:grid;grid-template-columns:minmax(180px,1fr) minmax(130px,.55fr) auto;gap:10px;align-items:end}.tile-form label{display:block;font-size:12px;font-weight:650;color:#52657a;margin-bottom:5px}.tile-form input{width:100%;padding:10px;border:1px solid #ccd8e1;border-radius:8px;font:inherit}.custom-tiles{display:grid;gap:7px;margin-top:12px}.custom-tile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#f5f8fa;border:1px solid #e2e9ee;border-radius:8px;font-size:13px}.tile-message{min-height:20px;margin-top:8px;font-size:12px;color:#176b52}.tile-message.error{color:#a33e3e}.table-wrap{overflow:auto;border:1px solid #dce5ec;border-radius:9px}table{border-collapse:collapse;width:100%;min-width:1180px;font-size:11px}th{background:#ffd966;color:#493900;font-weight:750;white-space:nowrap;padding:9px 8px;text-align:center;border:1px solid #e7d391}td{padding:8px;border:1px solid #e5ebf0;text-align:center;white-space:nowrap}.group-gap td{height:11px;padding:0;border:0;background:#fff}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}button{border:0;border-radius:8px;padding:10px 15px;background:#286c9b;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}button:hover{background:#1c587f}.download{display:none}.download.visible{display:inline-block}.download:disabled{opacity:.5;cursor:not-allowed}@media(max-width:760px){header{padding:25px 18px}h1{font-size:23px}main{padding:0 12px;margin-top:16px}.panel{padding:17px}.dropbox{padding:20px 12px}.section-toolbar{align-items:stretch;flex-direction:column}.section-tabs{flex:none;gap:6px}.section-tab{padding:9px 11px;font-size:13px}.download-all{align-self:flex-end}.tile-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>Metal BOM Sheet</h1>
  </header>
  <main>
    <section class="panel upload-panel">
      <h2>Upload BOM Data</h2>
      <div class="dropbox">
        <input id="bomFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Choose BOM Data Excel workbook">
        <strong>Choose your BOM Data file</strong>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section id="result" class="panel result" aria-live="polite">
      <div class="section-toolbar">
        <div class="section-tabs" role="tablist" aria-label="BOM sections">
          <button id="tab-summary" class="section-tab" type="button" role="tab" aria-selected="true" aria-controls="section-summary">Summary BOM Sheet</button>
          <button id="tab-hardware" class="section-tab" type="button" role="tab" aria-selected="false" aria-controls="section-hardware">Hardware BOM</button>
          <button id="tab-inhouse" class="section-tab" type="button" role="tab" aria-selected="false" aria-controls="section-inhouse">Inhouse BOM</button>
          <button id="tab-child" class="section-tab" type="button" role="tab" aria-selected="false" aria-controls="section-child">Child BOM</button>
        </div>
        <button id="downloadAll" class="download-all" type="button" disabled>Download BOM</button>
      </div>
      <section id="section-summary" class="section-content" role="tabpanel" aria-labelledby="tab-summary">
        <p class="sub" id="resultCaption">Generated from the uploaded workbook.</p>
        <div class="summary" id="summary"></div>
        <div id="tileVariants" class="variant-list" aria-label="Tile variants in Summary BOM"></div>
        <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="actions"><button id="download" class="download">Download Summary BOM Sheet</button></div>
      </section>
      <section id="section-hardware" class="section-content" role="tabpanel" aria-labelledby="tab-hardware" hidden>
        <p class="sub" id="hardwareCaption">Hardware components are read from single-letter SL.NO entries (A, B, C, and so on).</p>
        <div class="table-wrap"><table><thead><tr id="hardwareHead"></tr></thead><tbody id="hardwareRows"></tbody></table></div>
        <div class="actions"><button id="hardwareDownload" class="download" type="button">Download Hardware BOM</button></div>
      </section>
      <section id="section-inhouse" class="section-content" role="tabpanel" aria-labelledby="tab-inhouse" hidden>
        <div class="section-placeholder"><h3>Inhouse BOM</h3><p>This section is ready to be set up.</p></div>
      </section>
      <section id="section-child" class="section-content" role="tabpanel" aria-labelledby="tab-child" hidden>
        <div class="section-placeholder"><h3>Child BOM</h3><p>This section is ready to be set up.</p></div>
      </section>
    </section>
  </main>
  <script src="app.js?v=20261106-metal-header" defer></script>
</body>
</html>

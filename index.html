<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary BOM Sheet</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17324b;background:#f3f6f9;font-synthesis:none;font-optical-sizing:auto}
    *{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#153957,#286b96);color:#fff;padding:34px max(22px,calc((100vw - 1120px)/2))}h1{font-size:28px;margin:0;letter-spacing:-.35px}header p{margin:8px 0 0;color:#dcebf5;max-width:680px}main{max-width:1120px;padding:0 20px;margin:28px auto 60px}.panel{background:#fff;border:1px solid #dce5ec;border-radius:14px;box-shadow:0 12px 28px #17324b10;padding:24px;margin-bottom:20px}.upload-panel{max-width:760px;margin:0 auto 22px}h2{font-size:18px;margin:0 0 8px;color:#173d5b}.sub{color:#62788b;font-size:13px;margin:0 0 18px}.dropbox{border:2px dashed #b6c9d8;border-radius:12px;background:#f8fbfd;padding:25px;text-align:center}.dropbox input{display:block;width:min(100%,460px);margin:0 auto 12px;padding:10px;border:1px solid #ccd8e1;background:#fff;border-radius:8px;color:#29445b}.dropbox strong{display:block;margin-bottom:4px}.dropbox span{font-size:12px;color:#687f91}.status{min-height:22px;margin:14px 0 0;font-size:13px;color:#176b52}.status.error{color:#a33e3e}.result{display:none}.result.visible{display:block}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:14px 0 20px}.summary div{padding:11px 13px;background:#f5f8fa;border-radius:8px}.summary small{display:block;color:#657d8f;font-size:11px;margin-bottom:4px}.summary strong{font-size:14px;overflow-wrap:anywhere}.variant-list{display:grid;gap:7px;margin:0 0 18px}.variant-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#f5f8fa;border:1px solid #e2e9ee;border-radius:8px;font-size:13px}.remove-variant{padding:6px 10px;background:#fbeeee;color:#963f3f;font-size:12px}.remove-variant:hover{background:#f4dddd}.tile-form{display:grid;grid-template-columns:minmax(180px,1fr) minmax(130px,.55fr) auto;gap:10px;align-items:end}.tile-form label{display:block;font-size:12px;font-weight:650;color:#52657a;margin-bottom:5px}.tile-form input{width:100%;padding:10px;border:1px solid #ccd8e1;border-radius:8px;font:inherit}.custom-tiles{display:grid;gap:7px;margin-top:12px}.custom-tile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#f5f8fa;border:1px solid #e2e9ee;border-radius:8px;font-size:13px}.tile-message{min-height:20px;margin-top:8px;font-size:12px;color:#176b52}.tile-message.error{color:#a33e3e}.table-wrap{overflow:auto;border:1px solid #dce5ec;border-radius:9px}table{border-collapse:collapse;width:100%;min-width:1180px;font-size:11px}th{background:#ffd966;color:#493900;font-weight:750;white-space:nowrap;padding:9px 8px;text-align:center;border:1px solid #e7d391}td{padding:8px;border:1px solid #e5ebf0;text-align:center;white-space:nowrap}.group-gap td{height:11px;padding:0;border:0;background:#fff}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}button{border:0;border-radius:8px;padding:10px 15px;background:#286c9b;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}button:hover{background:#1c587f}.download{display:none}.download.visible{display:inline-block}.download:disabled{opacity:.5;cursor:not-allowed}@media(max-width:600px){header{padding:25px 18px}h1{font-size:23px}main{padding:0 12px;margin-top:16px}.panel{padding:17px}.dropbox{padding:20px 12px}.tile-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>Summary BOM Sheet</h1>
  </header>
  <main>
    <section class="panel upload-panel">
      <h2>Upload BOM Data</h2>
      <div class="dropbox">
        <input id="bomFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="Choose BOM Data Excel workbook">
        <strong>Choose your BOM Data file</strong>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section id="result" class="panel result" aria-live="polite">
      <h2>Summary BOM Sheet</h2>
      <p class="sub" id="resultCaption">Generated from the uploaded workbook.</p>
      <div class="summary" id="summary"></div>
      <div id="tileVariants" class="variant-list" aria-label="Tile variants in Summary BOM"></div>
      <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="actions"><button id="download" class="download">Download Summary BOM Sheet</button></div>
    </section>
  </main>
  <script src="app.js?v=20261104-config-path-fix" defer></script>
</body>
</html>
